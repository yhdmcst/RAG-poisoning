<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="SimHei, 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="940" height="600" fill="#ffffff"/>

  <!-- title & subtitle -->
  <text x="40" y="42" font-size="19" font-weight="bold" fill="#000">研究对象：RAG 管线形态 × 安全门位置</text>
  <text x="40" y="68" font-size="13.5" fill="#444">攻击：向知识库塞模板化毒文档 · 防御：轻量词重叠异常门控 SafeGate</text>

  <!-- knowledge base -->
  <rect x="60" y="140" width="150" height="200" rx="10" fill="#f0f0f0" stroke="#111" stroke-width="1.6"/>
  <text x="135" y="212" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">知识库</text>
  <text x="135" y="238" font-size="13" fill="#111" text-anchor="middle">分块 C128-S32</text>
  <text x="135" y="262" font-size="13" fill="#111" text-anchor="middle">clean + 毒文档</text>

  <!-- attacker -->
  <rect x="60" y="430" width="150" height="90" rx="10" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
  <text x="135" y="462" font-size="15" font-weight="bold" fill="#000" text-anchor="middle">攻击者</text>
  <text x="135" y="484" font-size="13" fill="#111" text-anchor="middle">每题注入</text>
  <text x="135" y="504" font-size="13" fill="#111" text-anchor="middle">5 篇毒文档</text>

  <!-- poisoning arrow -->
  <line x1="135" y1="430" x2="135" y2="346" stroke="#111" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="147" y="392" font-size="13" font-weight="bold" fill="#000">投毒</text>

  <!-- KB -> pipelines -->
  <line x1="210" y1="180" x2="259" y2="180" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="210" y1="375" x2="259" y2="375" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== simplified pipeline (dashed = prior work) ===== -->
  <text x="265" y="132" font-size="13.5" font-weight="bold" fill="#333">简化管线 · 已有研究常用</text>
  <rect x="265" y="145" width="150" height="70" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="340" y="174" font-size="14" fill="#000" text-anchor="middle">检索 top50</text>
  <text x="340" y="196" font-size="12.5" fill="#333" text-anchor="middle">直接取前 5</text>
  <line x1="415" y1="180" x2="649" y2="180" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="655" y="145" width="165" height="70" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="737" y="174" font-size="14" fill="#000" text-anchor="middle">Qwen3-8B</text>
  <text x="737" y="196" font-size="12.5" fill="#333" text-anchor="middle">生成答案</text>

  <!-- ===== multi-stage pipeline (solid bold = this work) ===== -->
  <text x="265" y="325" font-size="13.5" font-weight="bold" fill="#000">多阶段管线 · 本研究主对象</text>
  <rect x="265" y="335" width="150" height="80" rx="8" fill="#e8e8e8" stroke="#111" stroke-width="1.8"/>
  <text x="340" y="368" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">检索 top50</text>
  <text x="340" y="390" font-size="12.5" fill="#111" text-anchor="middle">BM25 / BGE</text>

  <line x1="415" y1="375" x2="424" y2="375" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <polygon points="455,341 483,375 455,409 427,375" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="455" y="432" font-size="13" font-weight="bold" fill="#000" text-anchor="middle">P_ret · 检索后</text>

  <line x1="483" y1="375" x2="494" y2="375" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="500" y="335" width="150" height="80" rx="8" fill="#e8e8e8" stroke="#111" stroke-width="1.8"/>
  <text x="575" y="368" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">重排</text>
  <text x="575" y="390" font-size="12.5" fill="#111" text-anchor="middle">bge-reranker</text>

  <line x1="650" y1="375" x2="680" y2="375" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <polygon points="712,341 740,375 712,409 684,375" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="712" y="432" font-size="13" font-weight="bold" fill="#000" text-anchor="middle">P_gen · 生成前</text>

  <line x1="740" y1="375" x2="754" y2="375" stroke="#111" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="760" y="335" width="165" height="80" rx="8" fill="#e8e8e8" stroke="#111" stroke-width="1.8"/>
  <text x="842" y="368" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Qwen3-8B</text>
  <text x="842" y="390" font-size="12.5" fill="#111" text-anchor="middle">生成答案</text>

  <!-- caption -->
  <text x="40" y="560" font-size="13.5" fill="#111">同一个 SafeGate 探针（词重叠异常检测）分别插在 P_ret 或 P_gen，对比攻击成功率、误报率与正常问答损耗</text>
</svg>
